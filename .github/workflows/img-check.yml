# Checks every photo of the game: the fast direct thumbnail and the original link (read only)
name: Image check
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          import sys, time, urllib.request, concurrent.futures as cf
          sys.path.insert(0, 'tools'); from thumbs import thumb, photos
          us = photos(open('index.html', encoding='utf-8').read())
          def get(u):
              t = time.time()
              try:
                  r = urllib.request.urlopen(urllib.request.Request(u, headers={'User-Agent': 'trivia-img-check/1.0 (github actions)'}), timeout=30)
                  n = len(r.read()); return r.status, round(time.time() - t, 2), n
              except Exception as e:
                  return getattr(e, 'code', 0) or str(e)[:40], round(time.time() - t, 2), 0
          with cf.ThreadPoolExecutor(6) as ex:
              res = list(ex.map(lambda u: (u, get(thumb(u)), get(u)), us))
          badT = [u for u, a, b in res if a[0] != 200]; badO = [u for u, a, b in res if b[0] != 200]
          avg = lambda L: round(sum(L) / max(1, len(L)), 2)
          print(f"::notice::total {len(us)} | thumb fail {len(badT)} | orig fail {len(badO)} | thumb avg {avg([a[1] for u,a,b in res if a[0]==200])}s {avg([a[2] for u,a,b in res if a[0]==200])//1000}KB | orig avg {avg([b[1] for u,a,b in res if b[0]==200])}s {avg([b[2] for u,a,b in res if b[0]==200])//1000}KB")
          for i in range(0, len(badT), 8): print('::notice::THUMBFAIL ' + ' || '.join(u.split('FilePath/')[1] + ' ' + str(dict((x[0], x[1]) for x in res)[u][0]) for u in badT[i:i+8]))
          for i in range(0, len(badO), 8): print('::notice::ORIGFAIL ' + ' || '.join(u.split('FilePath/')[1] for u in badO[i:i+8]))
          PY
