# Read-only: right-answer rate per question from saved duel and group games
name: Question stats
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: python3 tools/q_stats.py
      - uses: actions/upload-artifact@v4
        with: { name: q-stats, path: out/q_stats.csv }
