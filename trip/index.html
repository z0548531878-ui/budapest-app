<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0a07">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="בודפשט">
<link rel="preload" as="image" href="logo.webp" fetchpriority="high">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>html,body{margin:0;padding:0;background:#0b0a08}</style>
</head>
<body>
<title>שבת גיבוש בודפשט</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Frank+Ruhl+Libre:wght@500;700;900&family=Suez+One&display=swap">
<style>
/* Layout: phone app shell. Navy masthead with parliament silhouette, boarding-pass hero, soft card sections,
   fixed bottom tab bar with a sliding indicator, floating gold +, bottom sheets that spring up and swipe down. */
:root{
  --bg:#0a0f1e; --surface:#131a2d; --sunk:#1b2440; --ink:#eef1f8; --muted:#98a2bc; --line:#253050;
  --navy:#0e1832; --navy2:#1c2c56; --navy-ink:#f4efe2; --gold:#e0b25a; --gold2:#f2cb7c; --gold-soft:rgba(224,178,90,.15);
  --wine:#f28ea2; --wine-soft:rgba(242,142,162,.15);
  --ok:#5fd39b; --ok-soft:rgba(95,211,155,.15); --warn:#f2b257; --warn-soft:rgba(242,178,87,.15); --bad:#ff7d72; --bad-soft:rgba(255,125,114,.16);
  --glass:rgba(22,30,52,.72); --edge:rgba(255,255,255,.07);
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 10px 30px rgba(0,0,0,.35);
  --display:"Frank Ruhl Libre",Georgia,serif; --body:"Assistant","Segoe UI",Arial,sans-serif;
  --nav-h:68px; --ease:cubic-bezier(.2,.8,.2,1); color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;min-height:100%}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;background:
  radial-gradient(40% 30% at 80% 8%,rgba(224,178,90,.16),transparent 70%),
  radial-gradient(45% 35% at 10% 35%,rgba(70,100,210,.18),transparent 70%),
  radial-gradient(40% 30% at 70% 90%,rgba(140,60,110,.12),transparent 70%)}
@media (prefers-reduced-motion:no-preference){body::before{animation:drift 26s ease-in-out infinite alternate}@keyframes drift{to{transform:translate3d(-4%,3%,0) scale(1.06)}}}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
#app{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:0 calc(var(--nav-h) + 96px)}

.top{background:linear-gradient(180deg,rgba(28,44,86,.55),rgba(10,15,30,0));color:var(--navy-ink);margin-inline:-16px;padding:16px 16px 18px;display:flex;align-items:center;gap:12px;position:relative;overflow:hidden;border-bottom:1px solid rgba(224,178,90,.35)}
.top h1{font-family:var(--display);font-weight:700;font-size:22px;color:var(--gold2);margin:0;flex:1;line-height:1.15;position:relative}
.top .sub{display:block;font-family:var(--body);font-size:12.5px;font-weight:600;opacity:.72;margin-top:3px}
.top .sky{position:absolute;left:-6px;bottom:-2px;width:250px;height:52px;color:var(--gold2);opacity:.28;pointer-events:none}
.me{position:relative;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:var(--navy-ink);border-radius:99px;padding:6px 12px 6px 6px;font-size:14px;font-weight:800;display:flex;gap:7px;align-items:center}
.me i{width:24px;height:24px;border-radius:50%;background:var(--gold);color:#1b1407;font-style:normal;display:grid;place-items:center;font-size:12.5px}

.page-title{display:flex;align-items:center;gap:10px;margin:22px 2px 14px}
.page-title h2{font-family:var(--display);font-size:28px;margin:0;flex:1;line-height:1.1}
.page-title .cnt{font-size:14px;color:var(--muted);font-weight:800}
.back{border:1px solid var(--edge);background:var(--glass);box-shadow:var(--shadow);border-radius:99px;width:40px;height:40px;display:grid;place-items:center;font-size:24px;line-height:1}
.greet{margin:18px 2px 0;font-size:15px;color:var(--muted);font-weight:700}
.greet b{color:var(--ink);font-family:var(--display);font-size:26px;font-weight:700;display:block;line-height:1.15}

@media (prefers-reduced-motion:no-preference){
  .enter>*{animation:rise .42s var(--ease) both}
  .enter>*:nth-child(2){animation-delay:.04s}.enter>*:nth-child(3){animation-delay:.08s}.enter>*:nth-child(4){animation-delay:.12s}
  .enter>*:nth-child(5){animation-delay:.16s}.enter>*:nth-child(6){animation-delay:.2s}.enter>*:nth-child(n+7){animation-delay:.24s}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}}
  .check.on svg,.roll.on i{animation:pop .32s var(--ease)}
  @keyframes pop{0%{transform:scale(.2)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
  .row,.chip,.opt,.tile,.act,.btn,.roll,.stat{border:1px solid var(--edge)!important;transition:transform .14s var(--ease),background-color .2s,border-color .2s,color .2s}
  .row:active,.tile:active,.act:active,.roll:active,.btn:active,.stat:active{transform:scale(.985)}
  .bar i,.prog i{transition:width .9s var(--ease)}
  .ring circle.v{transition:stroke-dashoffset 1.1s var(--ease)}
  .shimmer{background:linear-gradient(90deg,var(--sunk) 0%,var(--surface) 50%,var(--sunk) 100%);background-size:200% 100%;animation:sh 1.2s linear infinite}
  @keyframes sh{to{background-position:-200% 0}}
  .pass-route .plane{animation:fly 3.4s var(--ease) infinite alternate}
  @keyframes fly{from{transform:translateX(-50px)}to{transform:translateX(0)}}
}

.nav{position:fixed;inset-inline:0;bottom:0;z-index:15;background:rgba(12,18,34,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h);position:relative}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:800;color:var(--muted);position:relative;z-index:1}
.nav svg{width:24px;height:24px;transition:transform .25s var(--ease)}
.nav button[aria-current="page"]{color:var(--gold2)}
.nav button[aria-current="page"] svg{transform:translateY(-1px) scale(1.08);color:var(--gold)}
.ind{position:absolute;top:8px;height:50px;width:calc(20% - 8px);margin-inline:4px;border-radius:16px;background:var(--gold-soft);transition:inset-inline-start .35s var(--ease);z-index:0}
.badge{position:absolute;top:7px;inset-inline-start:calc(50% + 7px);min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px;font-weight:800}
.fab{position:fixed;z-index:14;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));left:max(16px,calc(50% - 344px));width:60px;height:60px;border-radius:20px;border:0;background:linear-gradient(150deg,var(--gold2),var(--gold));color:#1b1407;font-size:34px;line-height:1;box-shadow:0 10px 24px rgba(168,119,28,.38);transition:transform .25s var(--ease),opacity .2s}
.fab:active{transform:scale(.92) rotate(90deg)}
.fab[hidden]{display:block!important;transform:scale(0);opacity:0;pointer-events:none}

.logo{width:50px;height:50px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 0 2px rgba(224,178,90,.55),0 0 22px rgba(224,178,90,.35);position:relative}
.ideabtn{position:relative;width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:var(--gold2);display:grid;place-items:center}
.ideabtn svg{width:22px;height:22px}
@media(max-width:430px){.top h1{font-size:18px}.top .sub{font-size:11.5px}.me span{display:none}.me{padding:6px}.logo{width:44px;height:44px}}
.splash{position:fixed;inset:0;z-index:60;background:radial-gradient(60% 50% at 50% 45%,#1d2c58,#0a0f1e 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:var(--gold2);font-family:var(--display);font-size:24px;font-weight:700;transition:opacity .5s var(--ease)}
.splash img{width:168px;height:168px;border-radius:50%;box-shadow:0 0 0 3px rgba(224,178,90,.6),0 0 60px rgba(224,178,90,.45)}
.splash.out{opacity:0;pointer-events:none}
@media (prefers-reduced-motion:no-preference){.splash img{animation:logoIn 1s var(--ease) both}.splash span{animation:rise .8s .35s var(--ease) both}
 @keyframes logoIn{from{transform:scale(.6) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
 .logo{animation:glow 4s ease-in-out infinite}@keyframes glow{50%{box-shadow:0 0 0 2px rgba(224,178,90,.75),0 0 30px rgba(224,178,90,.55)}}
 .pass{isolation:isolate}.pass::marker{content:none}
 .shine{position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.08) 50%,transparent 60%);transform:translateX(-120%);animation:shine 6s 1.2s ease-in-out infinite}
 @keyframes shine{0%,70%{transform:translateX(-120%)}100%{transform:translateX(120%)}}}
.recbtn{display:flex;align-items:center;gap:10px;width:100%;border:1px solid rgba(224,178,90,.45);background:var(--gold-soft);color:var(--gold2);border-radius:14px;padding:12px 14px;font-weight:800;margin-top:10px}
.recbtn .dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(224,178,90,.25);flex:0 0 auto}
.recbtn .dot svg{width:18px;height:18px}
.recbtn.on{background:rgba(255,125,114,.16);border-color:var(--bad);color:var(--bad)}
.recbtn.on .dot{background:var(--bad);color:#fff}
@media (prefers-reduced-motion:no-preference){.recbtn.on .dot{animation:pulse 1.2s ease-in-out infinite}@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(255,125,114,0)}0%{box-shadow:0 0 0 0 rgba(255,125,114,.5)}}}
.prop{border:1px solid var(--edge);background:rgba(0,0,0,.18);border-radius:14px;padding:12px;margin-top:8px;display:flex;gap:10px;align-items:flex-start}
.prop .main{flex:1;min-width:0}.prop b{display:block}.prop small{color:var(--muted)}
.prop.applied{border-color:var(--ok);background:var(--ok-soft)}
.prop.skipped{opacity:.45}
.thinking{display:flex;gap:10px;align-items:center;color:var(--muted);font-weight:700;margin-top:12px}
.thinking i{width:18px;height:18px;border-radius:50%;border:2px solid var(--gold);border-top-color:transparent;flex:0 0 auto}
@media (prefers-reduced-motion:no-preference){.thinking i{animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}}
.confetti{position:fixed;width:8px;height:8px;border-radius:2px;z-index:70;pointer-events:none}
.ccard{display:flex;gap:12px;align-items:center;width:100%;text-align:right;border-radius:18px;padding:15px;border:1px solid rgba(224,178,90,.35);background:linear-gradient(150deg,rgba(224,178,90,.16),rgba(28,44,86,.55));color:var(--ink)}
.ccard .main{flex:1;min-width:0}.ccard b{display:block;font-size:16.5px}.ccard span{font-size:13.5px;color:var(--muted)}
.qcard{background:var(--glass);border:1px solid var(--edge);border-radius:18px;padding:15px;margin-bottom:10px;box-shadow:var(--shadow)}
.qcard h4{margin:0 0 4px;font-size:16px;line-height:1.4}
.qcard p{margin:0 0 10px;color:var(--muted);font-size:14px}
.qcard textarea{width:100%;min-height:52px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:rgba(0,0,0,.2);color:var(--ink);resize:vertical}
.qcard .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.qcard.done{opacity:.62}
.note-in{width:100%;min-height:130px;padding:14px;border:1px solid var(--line);border-radius:16px;background:rgba(0,0,0,.25);color:var(--ink);font-size:17px;line-height:1.5;resize:vertical}
.updbar{display:flex;align-items:center;gap:10px;width:100%;text-align:right;border:1px dashed rgba(224,178,90,.5);background:rgba(224,178,90,.07);color:var(--ink);border-radius:16px;padding:11px 13px;margin:0 0 14px;font-weight:700}
.updbar .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--gold-soft);color:var(--gold2);flex:0 0 auto}
.updbar .ic svg{width:18px;height:18px}
.updbar .main{flex:1;min-width:0}.updbar b{display:block;font-size:15px}.updbar small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.updbar:active{transform:scale(.985)}
.bellbtn{position:relative}
.bellbtn .badge{top:-4px;inset-inline-start:auto;inset-inline-end:-4px}
.bellbtn .badge[hidden]{display:none}
.feed .it{display:flex;gap:11px;align-items:flex-start;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;text-align:right;background:none;border-inline:0;border-top:0;color:var(--ink)}
.feed .it:last-child{border-bottom:0}
.feed .av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--gold-soft);color:var(--gold2);font-weight:900;flex:0 0 auto}
.feed .it .main{flex:1;min-width:0}.feed .it b{font-size:14.5px}.feed .it small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.feed .it.new{background:rgba(224,178,90,.07)}
.feed .it.new .av{background:var(--gold);color:#1a1405}
.mt3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.mt3 div{background:rgba(255,255,255,.08);border-radius:12px;padding:10px 8px;min-width:0;text-align:center}
.mt3 span{display:block;font-size:12px;opacity:.78;font-weight:800}
.mt3 b{display:block;font-size:17px;margin-top:2px}
.mt3 .neg{color:#ff9d93}.mt3 .pos{color:#8fe0b7}
.erow .amt{font-size:16px}
.est{font-size:12.5px;font-weight:800}
.est.ok{color:var(--ok)}.est.w{color:var(--warn)}.est.m{color:var(--muted)}
.ideabtn.spk{background:linear-gradient(150deg,var(--gold2),var(--gold));color:#1a1405;border:0;box-shadow:0 0 18px rgba(224,178,90,.45)}
@media (prefers-reduced-motion:no-preference){.ideabtn.spk svg{animation:twk 3.2s ease-in-out infinite}@keyframes twk{50%{transform:rotate(18deg) scale(1.08)}}}
.steps{counter-reset:st;display:grid;gap:10px}
.step{display:flex;gap:12px;align-items:flex-start;background:var(--glass);border:1px solid var(--edge);border-radius:16px;padding:13px 14px}
.step .n{width:34px;height:34px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;background:var(--gold-soft);color:var(--gold2);font-weight:900}
.step .n svg{width:18px;height:18px}
.step b{display:block;font-size:15.5px;margin-bottom:2px}.step p{margin:0;color:var(--muted);font-size:14px;line-height:1.5}
.guidecard{border:1px solid rgba(224,178,90,.45);background:linear-gradient(150deg,rgba(224,178,90,.14),rgba(28,44,86,.5));border-radius:18px;padding:14px 15px;margin-bottom:14px}
.guidecard h4{margin:0 0 8px;font-size:16px}.guidecard ol{margin:0;padding-inline-start:20px;color:var(--ink);font-size:14px;line-height:1.7}
.guidecard .acts{display:flex;gap:8px;margin-top:10px}
.rechelp{display:grid;gap:10px;margin-top:10px!important;background:rgba(224,178,90,.08);border:1px solid rgba(224,178,90,.35);border-radius:14px;padding:12px;color:var(--ink)!important;font-size:14px;line-height:1.55}
.rechelp .h{font-size:14.5px}
.rechelp .w{display:flex;gap:10px;align-items:flex-start}.rechelp .w b.t{display:block}
.rechelp .k{width:26px;height:26px;border-radius:50%;background:var(--gold);color:#1a1405;font-weight:900;display:grid;place-items:center;flex:0 0 auto}
.mic{display:flex;gap:10px;align-items:center;font-size:13.5px;color:var(--muted);margin-top:8px}
.mic i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--gold-soft);color:var(--gold2);font-style:normal;flex:0 0 auto}
.mic i svg{width:16px;height:16px}
.pass{border:1px solid var(--edge)!important;margin:14px 0 0;display:flex;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:22px;overflow:hidden;position:relative;box-shadow:var(--shadow)}
.pass-main{flex:1;min-width:0;padding:15px 16px}
.pass-top{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:800;color:var(--muted)}
.pass-route{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0 0;direction:ltr}
.pass-route div{display:flex;flex-direction:column;align-items:center}
.pass-route b{font-family:var(--display);font-size:36px;line-height:1;font-weight:900;letter-spacing:.02em}
.pass-route span{font-size:14px;font-weight:800;color:var(--muted)}
.pass-route .path{flex:1;max-width:150px;height:22px;color:var(--gold)}
.pass-route .path svg{width:100%;height:100%;overflow:visible}
.pass-stub{flex:0 0 100px;background:linear-gradient(170deg,var(--navy2),var(--navy));color:var(--navy-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-inline-start:2px dashed rgba(255,255,255,.3);text-align:center;padding:10px 6px}
.pass-stub .big{text-shadow:0 0 24px rgba(242,203,124,.45);font-family:var(--display);font-weight:900;font-size:50px;line-height:.95;color:var(--gold2)}
.pass-stub small{font-size:12.5px;font-weight:800;opacity:.85}
.pass::before,.pass::after{content:"";position:absolute;left:89px;width:22px;height:22px;border-radius:50%;background:var(--bg);z-index:1}
.pass::before{top:-11px}.pass::after{bottom:-11px}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px}
.days div{border-radius:10px;padding:7px 3px;text-align:center;background:var(--sunk);font-size:12px;line-height:1.25;color:var(--muted)}
.days b{display:block;font-size:13.5px;color:var(--ink)}
.days .sh{background:var(--wine-soft)} .days .sh b{color:var(--wine)}
.days .now{outline:2px solid var(--gold)}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stat{background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(12px);border-radius:16px;padding:14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;text-align:right;border:0;width:100%}
.stat .tx{min-width:0}
.stat span{display:block;font-size:12.5px;color:var(--muted);font-weight:800}
.stat b{font-size:22px;font-weight:800;line-height:1.15}
.ring{width:48px;height:48px;flex:0 0 auto;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6}
.ring .bgc{stroke:var(--sunk)} .ring .v{stroke:var(--ok);stroke-linecap:round}

.sec{margin-top:24px}
.sec-h{display:flex;align-items:baseline;gap:8px;margin:0 2px 10px}
.sec-h h3{font-size:18px;font-weight:800;margin:0;flex:1}
.sec-h .link{border:0;background:none;color:var(--gold);font-weight:800;font-size:14px;padding:4px}
.card{background:var(--glass);border:1px solid var(--edge);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.row{display:flex;gap:12px;align-items:center;padding:13px 14px;border-top:1px solid var(--line);width:100%;text-align:right;background:none;border-inline:0;border-bottom:0;min-height:60px}
.row:first-child{border-top:0}
.row .main{flex:1 1 auto;min-width:0}
.row .t{font-weight:700;overflow-wrap:anywhere;line-height:1.35}
.row .m{font-size:13.5px;color:var(--muted);display:flex;gap:4px 10px;flex-wrap:wrap;margin-top:3px;align-items:center}
.row .end{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:5px;text-align:left}
.row.done .t{text-decoration:line-through;color:var(--muted);font-weight:600}
.row.urgent{box-shadow:inset -4px 0 0 var(--bad)}
.amt{font-weight:800}
.check{flex:0 0 auto;width:30px;height:30px;border-radius:50%;border:2px solid #3a4668;background:transparent;display:grid;place-items:center;padding:0;color:#fff}
.check.on{background:var(--ok);border-color:var(--ok)}
.check svg{width:16px;height:16px}
.pill{font-size:12.5px;font-weight:800;padding:3px 10px;border-radius:99px;white-space:nowrap;border:0;display:inline-block}
button.pill{padding:7px 12px;font-size:13px}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-bad{background:var(--bad-soft);color:var(--bad)} .p-mute{background:var(--sunk);color:var(--muted)} .p-gold{background:var(--gold-soft);color:var(--gold)}
.who{font-size:12.5px;font-weight:800;color:var(--ink);background:var(--sunk);border-radius:6px;padding:1px 7px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:2px}
.note{font-size:14px;color:var(--muted);margin:0 2px 12px}
.ghead{display:flex;justify-content:space-between;gap:8px;margin:20px 4px 8px;font-size:14px;font-weight:800;color:var(--muted)}
.skel{height:60px;border-top:1px solid var(--line)}

.seg{display:flex;background:var(--sunk);border-radius:14px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;border-radius:11px;padding:10px 4px;font-weight:800;font-size:14px;color:var(--muted);transition:background-color .2s,color .2s,box-shadow .2s}
.seg button[aria-pressed="true"]{background:var(--gold-soft);color:var(--gold2);box-shadow:inset 0 0 0 1px rgba(224,178,90,.35)}
.seg .c{font-weight:600;opacity:.75;margin-inline-start:3px}
.seg button{font-size:13.5px}
.chips{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 12px;padding:2px 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--glass);border-radius:99px;padding:8px 14px;font-size:14px;font-weight:700}
.chip[aria-pressed="true"]{background:var(--gold-soft);color:var(--gold2);border-color:rgba(224,178,90,.55)}
.quick{border:1px solid var(--edge)!important;display:flex;gap:8px;margin-bottom:12px;background:var(--glass);border-radius:16px;padding:6px;box-shadow:var(--shadow)}
.quick input{flex:1;min-width:0;padding:10px;border:0;background:none;outline:none}
.quick button{border:0;border-radius:12px;background:linear-gradient(150deg,var(--gold2),var(--gold));color:#1b1407;padding:0 18px;font-weight:800}
.search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--glass);margin-bottom:12px}
.btn{border:1px solid var(--line);background:var(--glass);border-radius:13px;padding:12px 16px;font-weight:800;text-decoration:none;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.btn.primary{background:linear-gradient(150deg,var(--gold2),var(--gold));color:#1b1407;border-color:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:#fff}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.act .ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--gold-soft);color:var(--gold2)}
.act .ico svg{width:24px;height:24px}
@media (prefers-reduced-motion:no-preference){.act:hover .ico{transform:translateY(-2px)}.act .ico{transition:transform .2s var(--ease)}}
.act{border:1px solid var(--edge)!important;background:var(--glass);border-radius:16px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13.5px;font-weight:800;box-shadow:var(--shadow)}
.act b{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:20px;background:var(--gold-soft);color:var(--gold)}
.msgcard{color:var(--ink);display:flex;gap:12px;align-items:center;width:100%;text-align:right;background:var(--gold-soft);border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);border-radius:16px;padding:14px}
.msgcard .main{flex:1;min-width:0}
.msgcard b{display:block}
.msgcard span{font-size:13.5px;color:var(--muted)}

.money-top{border:1px solid rgba(224,178,90,.25);background:linear-gradient(160deg,#1f3264,#0f1a36);color:var(--navy-ink);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.money-top .lbl{font-size:13px;font-weight:800;opacity:.75}
.money-top .bal{font-family:var(--display);font-size:38px;font-weight:900;line-height:1.05;margin:2px 0 4px}
.money-top .bal.neg{color:#ff9d93} .money-top .bal.pos{color:#8fe0b7}
.money-top .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.money-top .row2 div{background:rgba(255,255,255,.08);border-radius:12px;padding:10px;min-width:0}
.money-top .row2 span{display:block;font-size:12px;opacity:.75;font-weight:800}
.money-top .row2 b{font-size:18px}
.money-top small{font-size:12.5px;opacity:.72}
.bar{height:8px;background:rgba(255,255,255,.14);border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:99px}
.prog{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--ok);border-radius:99px}

.tl .row{align-items:flex-start}
.tl .time{flex:0 0 54px;font-weight:800;color:var(--gold);padding-top:1px;font-size:15px}
.tl.shabbat .time{color:var(--wine)}
.flights{display:grid;gap:10px;margin-bottom:14px}
.flight{border:1px solid var(--edge)!important;background:var(--glass);border-radius:16px;padding:13px 14px 13px 14px;display:grid;grid-template-columns:1fr auto;gap:3px 10px;width:100%;text-align:right;box-shadow:var(--shadow);position:relative;overflow:hidden}
.flight::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:4px;background:var(--gold)}
.flight .fn{font-weight:800}
.flight .route{font-size:20px;font-weight:800;display:flex;gap:8px;align-items:baseline;grid-column:1/-1;direction:ltr;justify-content:flex-end}
.flight .route small{font-size:13px;font-weight:700;color:var(--muted)}
.flight .meta{font-size:13.5px;color:var(--muted);grid-column:1/-1}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border:1px solid var(--edge)!important;background:var(--glass);border-radius:18px;padding:16px;text-align:right;display:flex;flex-direction:column;gap:8px;min-height:120px;box-shadow:var(--shadow)}
.ic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--sunk);color:var(--gold);flex:0 0 auto}
.ic svg{width:22px;height:22px}
.tile b{font-size:16.5px}
.tile span:last-child{font-size:13px;color:var(--muted);margin-top:auto}
.msgtext{white-space:pre-wrap;background:var(--bg);border-radius:14px;padding:14px;font-size:15px;line-height:1.6;max-height:44vh;overflow:auto}
.counter{display:flex;align-items:baseline;gap:8px}
.counter b{font-family:var(--display);font-size:52px;font-weight:900;color:var(--ok);line-height:1}
.counter span{font-size:16px;font-weight:800;color:var(--muted)}
.rollgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.roll{border:1px solid var(--line);background:var(--glass);border-radius:14px;padding:12px 10px;text-align:right;font-weight:800;min-height:54px;display:flex;align-items:center;gap:8px}
.roll.on{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.roll i{width:22px;height:22px;border-radius:50%;border:2px solid currentColor;flex:0 0 auto;display:grid;place-items:center;font-style:normal;font-size:12px}
.openlink{color:var(--gold);font-weight:800;text-decoration:none;padding:6px}

.scrim{position:fixed;inset:0;background:rgba(6,10,20,0);display:flex;align-items:flex-end;justify-content:center;z-index:30;transition:background-color .25s}
.scrim.open{background:rgba(6,10,20,.5)}
.sheet{background:#121a2e;border-top:1px solid var(--edge);width:100%;max-width:600px;max-height:92%;overflow:auto;border-radius:24px 24px 0 0;padding:10px 16px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .32s var(--ease)}
.scrim.open .sheet{transform:none}
.grip{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
@media(min-width:760px){.scrim{align-items:center}.sheet{border-radius:24px;transform:translateY(30px) scale(.97);opacity:0;transition:transform .3s var(--ease),opacity .25s}.scrim.open .sheet{opacity:1}.grip{display:none}}
.sheet h3{font-family:var(--display);font-size:24px;margin:0 0 14px;line-height:1.2}
.form{display:grid;gap:15px}
.field{display:flex;flex-direction:column;gap:7px;font-size:14px;font-weight:800;color:var(--muted);min-width:0}
.field input,.field textarea{padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font-weight:500;font-size:16px;width:100%}
.field textarea{min-height:80px;resize:vertical}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:1px solid var(--line);background:var(--bg);border-radius:11px;padding:9px 13px;font-size:15px;font-weight:700;color:var(--ink)}
.opt[aria-pressed="true"]{background:var(--gold-soft);border-color:var(--gold)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:16px;font-weight:800;color:var(--ink);background:var(--bg);border-radius:12px;padding:12px 14px}
.toggle input{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;transition:background .2s;flex:0 0 auto;cursor:pointer;margin:0}
.toggle input::after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:right .22s var(--ease)}
.toggle input:checked{background:var(--ok)} .toggle input:checked::after{right:21px}
.sheet-acts{display:flex;gap:8px;margin-top:20px;align-items:center;flex-wrap:wrap}
.sheet-acts .sp{flex:1}
.paybtns{display:grid;gap:8px}
.paybtns button{padding:15px;border-radius:14px;border:1px solid var(--line);background:var(--bg);font-weight:800;font-size:16px;text-align:right}
.paybtns button.on{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.rem{border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.rem .main{flex:1 1 150px;min-width:0}
.rem a{color:var(--ok);font-weight:800;text-decoration:none;padding:6px}
.toast{border:1px solid rgba(224,178,90,.4);position:fixed;bottom:calc(var(--nav-h) + 92px + env(safe-area-inset-bottom,0px));inset-inline:0;margin:auto;width:max-content;max-width:92%;background:#1d2744;color:var(--ink);padding:11px 16px;border-radius:14px;z-index:40;font-weight:800;display:flex;gap:14px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.25);transform:translateY(20px);opacity:0;transition:transform .3s var(--ease),opacity .25s}
.toast.show{transform:none;opacity:1}
.toast button{border:0;background:none;color:var(--gold2);font-weight:800;padding:2px 4px}
.banner{margin:14px 0 0;padding:12px 14px;border-radius:14px;background:var(--warn-soft);color:var(--warn);font-size:14.5px;font-weight:700}

/* ===== Light "Budapest stone" theme: warm sand surfaces, navy masthead, deep gold accents ===== */
:root{
  --bg:#e6dfd1; --surface:#f4efe6; --sunk:#e3dbcb; --ink:#1d2540; --muted:#5f6274; --line:#d6ccb8;
  --navy:#16244a; --navy2:#263b72; --navy-ink:#f6efdf; --gold:#9a6a12; --gold2:#b88124; --gold-soft:rgba(184,129,36,.14);
  --wine:#9c3552; --wine-soft:rgba(156,53,82,.11);
  --ok:#1d7f53; --ok-soft:rgba(29,127,83,.12); --warn:#a86200; --warn-soft:rgba(168,98,0,.12); --bad:#bf3528; --bad-soft:rgba(191,53,40,.11);
  --glass:rgba(247,243,235,.86); --edge:rgba(29,37,64,.08);
  --shadow:0 1px 2px rgba(29,37,64,.05),0 10px 28px -8px rgba(29,37,64,.16);
  --goldbtn:linear-gradient(150deg,#f1cd82,#d9a64b); --goldbtn-ink:#2a1c03;
  color-scheme:light;
}
body{background:var(--bg)}
body::before{background:
  radial-gradient(40% 28% at 85% 6%,rgba(214,166,75,.28),transparent 70%),
  radial-gradient(45% 35% at 8% 40%,rgba(120,150,210,.18),transparent 70%),
  radial-gradient(40% 30% at 70% 95%,rgba(176,110,130,.14),transparent 70%)}
.top{background:linear-gradient(170deg,#1c2d5c,#101b3a);border-bottom:0;box-shadow:0 10px 30px -14px rgba(16,27,58,.6);margin-bottom:6px;border-radius:0 0 24px 24px;padding:14px 16px 16px}
.top h1{color:#f2cb7c}
.top .ideabtn{color:#f2cb7c;background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.22)}
.top .ideabtn.spk{background:var(--goldbtn);color:var(--goldbtn-ink)}
.logo{width:56px;height:56px}
.nav{background:rgba(246,241,232,.92);border-top:1px solid var(--line);box-shadow:0 -8px 24px -12px rgba(29,37,64,.18)}
.nav button[aria-current="page"],.nav button[aria-current="page"] svg{color:var(--gold)}
.ind{background:var(--gold-soft)}
.fab,.quick button,.btn.primary{background:var(--goldbtn);color:var(--goldbtn-ink)}
.fab{box-shadow:0 12px 26px -6px rgba(154,106,18,.55)}
.btn{background:var(--surface)}
.sheet{background:#f3eee4;border-top:0;box-shadow:0 -20px 50px -20px rgba(16,27,58,.45)}
.scrim.open{background:rgba(16,24,48,.42)}
.field input,.field textarea,.opt,.toggle{background:#faf6ee}
.toggle input::after{background:#fdfaf3}
.check{border-color:#b9ad95}
.prop{background:rgba(29,37,64,.035)}
.note-in,.qcard textarea{background:#faf6ee}
.ccard,.guidecard{background:linear-gradient(150deg,rgba(214,166,75,.2),rgba(247,243,235,.92));border-color:rgba(184,129,36,.35)}
.card .mt3 div,.mt3.light div{background:var(--sunk)}
.card .mt3 .neg{color:var(--bad)}.card .mt3 .pos{color:var(--ok)}
.toast{background:#1c2a52;color:#f6efdf;border-color:rgba(242,203,124,.4)}
.toast button{color:#f2cb7c}
.seg{background:var(--sunk)}
.seg button[aria-pressed="true"]{background:#faf6ee;color:var(--ink);box-shadow:0 1px 2px rgba(29,37,64,.08),0 4px 12px -4px rgba(29,37,64,.18)}
.chip{background:var(--surface)}
.chip[aria-pressed="true"]{background:var(--navy);color:#f6efdf;border-color:var(--navy)}
.days div{background:var(--sunk)}
.updbar{background:rgba(184,129,36,.07)}
.feed .it.new{background:rgba(184,129,36,.08)}
.feed .it.new .av{background:var(--goldbtn);color:var(--goldbtn-ink)}
.pass-route b{color:var(--navy)}
.who{background:var(--sunk);color:var(--ink)}
.banner{border:1px solid rgba(168,98,0,.25)}

.top .sky{opacity:.13}
.guidecard{margin-top:14px}
.mt3 b{font-size:15.5px;white-space:nowrap}
.stat b{white-space:nowrap}
.sync{flex-wrap:wrap}
.sync .btns{width:100%;padding-top:2px}
.sync .btns .btn{flex:1;justify-content:center}
.row.urgent .pill.p-bad{display:none}
/* ===== Splash: big logo ===== */
.splash{background:radial-gradient(70% 55% at 50% 42%,#2a3f7a,#101b3a 72%);gap:22px;font-size:28px}
.splash img{width:min(68vw,320px);height:min(68vw,320px);box-shadow:0 0 0 4px rgba(242,203,124,.65),0 0 90px rgba(242,203,124,.5)}
.splash small{font-family:var(--body);font-size:15px;font-weight:700;color:rgba(246,239,223,.75);letter-spacing:.02em}

/* ===== Calmer home ===== */
.hello{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:16px 2px 0}
.hello .greet{margin:0}
.hello .date{font-size:13px;font-weight:800;color:var(--muted);padding-bottom:4px}
.hub{margin-top:16px;display:grid;gap:10px}
.hub .big{display:flex;align-items:center;gap:14px;width:100%;text-align:right;border:0;border-radius:20px;padding:16px;background:linear-gradient(160deg,#1f3264,#14224a);color:#f6efdf;box-shadow:0 14px 30px -14px rgba(16,27,58,.7);position:relative;overflow:hidden}
.hub .big .ic{width:48px;height:48px;border-radius:16px;background:var(--goldbtn);color:var(--goldbtn-ink)}
.hub .big .ic svg{width:24px;height:24px}
.hub .big b{display:block;font-size:18px}.hub .big span{font-size:13.5px;opacity:.78}
.hub .big .main{flex:1;min-width:0}
.hub .big .mic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.12);color:#f2cb7c;margin:0;flex:0 0 auto}
.hub .big .mic svg{width:20px;height:20px}
.sync{display:flex;align-items:center;gap:12px;border-radius:18px;padding:12px 12px 12px 14px;background:var(--glass);border:1px solid var(--edge);box-shadow:var(--shadow)}
.sync .dot{width:12px;height:12px;border-radius:50%;background:var(--ok);flex:0 0 auto;box-shadow:0 0 0 4px var(--ok-soft)}
.sync.has .dot{background:#d9a64b;box-shadow:0 0 0 4px rgba(217,166,75,.22)}
.sync .main{flex:1;min-width:0}.sync b{display:block;font-size:15px}.sync small{color:var(--muted);font-size:12.5px}
.sync .btns{display:flex;gap:6px}
.sync .btns .btn{padding:9px 12px;font-size:13.5px;border-radius:12px}
.shortcuts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.shortcuts button{border:1px solid var(--edge);background:var(--glass);border-radius:16px;padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;font-weight:800;color:var(--ink);box-shadow:var(--shadow)}
.shortcuts .ico{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--gold-soft);color:var(--gold)}
.shortcuts .ico svg{width:22px;height:22px}
.updbar.slim{padding:8px 12px;margin-bottom:12px;border-style:solid;border-color:rgba(184,129,36,.28)}
.updbar.slim .ic{width:30px;height:30px;border-radius:10px}
.updbar.slim b{font-size:14px;font-weight:800}
.updbar.slim small{display:none}

/* ===== Motion ===== */
@media (prefers-reduced-motion:no-preference){
  .enter>*{animation:rise2 .55s var(--ease) both}
  @keyframes rise2{from{opacity:0;transform:translateY(16px) scale(.985);filter:blur(3px)}}
  .card .row{animation:rowIn .45s var(--ease) both}
  .card .row:nth-child(2){animation-delay:.03s}.card .row:nth-child(3){animation-delay:.06s}.card .row:nth-child(4){animation-delay:.09s}.card .row:nth-child(5){animation-delay:.12s}.card .row:nth-child(n+6){animation-delay:.15s}
  @keyframes rowIn{from{opacity:0;transform:translateX(-10px)}}
  .sheet>*{animation:rise .4s var(--ease) both}.sheet>*:nth-child(2){animation-delay:.05s}.sheet>*:nth-child(3){animation-delay:.09s}.sheet>*:nth-child(n+4){animation-delay:.13s}
  .nav button[aria-current="page"] svg{animation:bounce .45s var(--ease)}
  @keyframes bounce{0%{transform:scale(.8)}55%{transform:scale(1.18) translateY(-2px)}100%{transform:scale(1.08) translateY(-1px)}}
  .hub .big::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.12) 50%,transparent 60%);transform:translateX(-120%);animation:shine 5s 1s ease-in-out infinite}
  .hub .big .ic{animation:float 3.6s ease-in-out infinite}
  @keyframes float{50%{transform:translateY(-3px) rotate(-4deg)}}
  .sync.has .dot{animation:beat 1.6s ease-in-out infinite}
  @keyframes beat{50%{box-shadow:0 0 0 8px rgba(217,166,75,0)}}
  .card,.tile,.shortcuts button,.stat,.flight,.sync{transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
  .tile:active,.shortcuts button:active,.hub .big:active{transform:scale(.97)}
  .splash img{animation:logoIn2 1.1s var(--ease) both}
  @keyframes logoIn2{0%{transform:scale(.5) rotate(-18deg);opacity:0;filter:blur(6px)}60%{transform:scale(1.05) rotate(2deg);opacity:1;filter:none}100%{transform:none}}
  .splash small{animation:rise .8s .55s var(--ease) both}
  .top .logo{animation:glow 4s ease-in-out infinite}
}

.cashgrid{display:grid;gap:10px}
.cashcard{display:flex;align-items:center;gap:12px;width:100%;text-align:right;border:1px solid var(--edge);background:var(--glass);border-radius:18px;padding:14px;box-shadow:var(--shadow);color:var(--ink)}
.cashcard.on{border-color:var(--gold);box-shadow:0 0 0 2px rgba(184,129,36,.25),var(--shadow)}
.cashcard .av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--goldbtn);color:var(--goldbtn-ink);font-weight:900;font-size:18px;flex:0 0 auto}

.splash{overflow:hidden}

  @keyframes dust{0%{opacity:0;transform:translateY(0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translateY(-70vh) scale(1.2)}}
  .splash span{animation:rise .8s .35s var(--ease) both,glowtxt 2.4s 1s ease-in-out infinite}
  @keyframes glowtxt{50%{text-shadow:0 0 18px rgba(242,203,124,.6)}}
  .splash.out{transform:scale(1.06);transition:opacity .55s var(--ease),transform .55s var(--ease)}
  /* header logo sheen */
  .top .logo{animation:glow 4s ease-in-out infinite,turn 14s ease-in-out infinite}
  @keyframes turn{0%,88%,100%{transform:none}94%{transform:rotateY(180deg)}}
  /* tap ripple */
  .rpl{position:absolute;border-radius:50%;pointer-events:none;background:rgba(255,255,255,.45);transform:scale(0);animation:rpl .6s var(--ease) forwards}
  @keyframes rpl{to{transform:scale(2.6);opacity:0}}
  /* counter + stats */
  .pass-stub .big{animation:breathe 3.2s ease-in-out infinite}
  @keyframes breathe{50%{transform:scale(1.06)}}
  .stat .ring{transition:transform .3s var(--ease)}.stat:active .ring{transform:rotate(-90deg) scale(.9)}
  .tiles .tile{animation:tileIn .5s var(--ease) both}
  .tiles .tile:nth-child(2n){animation-delay:.05s}.tiles .tile:nth-child(3n){animation-delay:.1s}
  @keyframes tileIn{from{opacity:0;transform:translateY(14px) scale(.96)}}
  .tile .ic{transition:transform .3s var(--ease)}.tile:active .ic{transform:rotate(-10deg) scale(1.1)}
  .shortcuts .ico{animation:float 4s ease-in-out infinite}
  .shortcuts button:nth-child(2) .ico{animation-delay:.4s}.shortcuts button:nth-child(3) .ico{animation-delay:.8s}.shortcuts button:nth-child(4) .ico{animation-delay:1.2s}
  .chip[aria-pressed="true"],.seg button[aria-pressed="true"]{animation:popin .3s var(--ease)}
  @keyframes popin{0%{transform:scale(.92)}100%{transform:none}}
  .cashcard{animation:tileIn .5s var(--ease) both}.cashcard:nth-child(2){animation-delay:.06s}.cashcard:nth-child(3){animation-delay:.12s}
}

const view=document.getElementById('view');
view.addEventListener('click',e=>{
  const t=e.target;
  if(t.closest('[data-stop]')){e.stopPropagation();return}
  const g=t.closest('[data-go]');if(g){go(g.dataset.go,JSON.parse(g.dataset.opts||'{}'));return}
  if(t.closest('[data-pickme]')){pickMe();return}
  if(t.closest('#seeAct')){actSheet();return}
  if(t.id==='guideOk'){guideDone=true;try{localStorage.setItem('guideDone','1')}catch(_){}render(true);return}
  const cp=t.closest('[data-copy]');if(cp){e.stopPropagation();copy(cp.dataset.copy);return}
  const tg=t.closest('[data-toggle]');if(tg){e.stopPropagation();toggle(tg.dataset.toggle,tg);return}
  const pay=t.closest('[data-pay]');if(pay){e.stopPropagation();paySheet(pay.dataset.pay);return}
  const dn=t.closest('[data-don]');if(dn){e.stopPropagation();const d=find('donations',dn.dataset.don);if(d){const prev=d.status;save('donations',d._id,{...strip(d),status:prev==='התקבל'?'התחייב':'התקבל'}).then(ok=>ok&&toast(prev==='התקבל'?'סומן כהתחייבות':'סומן שהתקבל',()=>save('donations',d._id,strip(d))))}return}
  const sg=t.closest('[data-seg]');if(sg){V.seg=sg.dataset.seg;V.filter={};render(true);return}
  const fl=t.closest('[data-filter]');if(fl){const k=fl.dataset.filter;V.filter[k]=k==='open'?!V.filter.open:fl.dataset.val;render(k!=='open');return}
  if(t.closest('[data-remind]')){reminder();return}
  const nw=t.closest('[data-new]');if(nw){editor(nw.dataset.new,null);return}
  const sb=t.closest('[data-sub]');if(sb){if(V.tab!=='more')V.tab='more';V.sub=sb.dataset.sub;V.filter={};render(true);window.scrollTo({top:0});return}
  if(t.closest('[data-back]')){navBack();return}
  const f=t.closest('[data-flight]');if(f){flightSheet(f.dataset.flight);return}
  if(t.closest('[data-idea]')){updSheet(curScope());return}
  if(t.closest('[data-actfeed]')){actSheet();return}
  const pk=t.closest('[data-pick]');if(pk){const x=find('claude',pk.dataset.pick);if(x){save('claude',x._id,{...strip(x),answer:pk.dataset.v,answeredAt:new Date().toISOString(),status:'נענה'}).then(ok=>ok&&toast('נשמר: '+pk.dataset.v))}return}
  const so=t.closest('[data-sugok]');if(so){e.stopPropagation();const x=find('packing',so.dataset.sugok);if(x){save('packing',x._id,{...strip(x),sug:false}).then(ok=>{if(ok)toast('נכנס לרשימת הקניות',()=>save('packing',x._id,strip(x)))})}return}
  const nr=t.closest('[data-nr]');if(nr){e.stopPropagation();const x=find('packing',nr.dataset.nr);if(x){db.doc('packing/'+x._id).delete().then(()=>{logAct('delete','packing',x._id,x);toast('הוסר',()=>save('packing',x._id,strip(x)))})}return}
  if(t.closest('[data-bulk]')){bulkSheet();return}
  const pr=t.closest('[data-person]');if(pr&&!t.closest('a')){personSheet(pr.dataset.person);return}
  const pp=t.closest('[data-pp]');if(pp){const p=find('participants',pp.dataset.pp);if(p){const on=!p.passport;pp.classList.toggle('on',on);pp.innerHTML=on?CHECK:'';if(on)burst(pp);save('participants',p._id,{...strip(p),passport:on})}return}
  if(t.closest('[data-send]')){if(CAN_SEND())sendSheet();return}
  if(t.closest('[data-code]')){codeSheet();return}
  const ub=t.closest('[data-upd]');if(ub){updSheet(ub.dataset.upd);return}
  if(t.closest('#sortAll')){if(CAN_SEND())sendSheet();else toast('שלומי שולח את העדכונים ל-Claude');return}

function rolesMap(){
  const M={}, full=n=>TEAM_FULL[n]||n;
  const put=(n,o)=>{n=full(String(n||'').trim());if(!n)return;(M[n]=M[n]||[]).push(o)};
  const split=v=>String(v||'').split(/,\s*/).map(x=>x.trim()).filter(Boolean);
  S.participants.forEach(p=>{
    String(p.duties||'').split(/\s*·\s*/).filter(Boolean).forEach(d=>put(p.name,{k:'role',t:d,e:'participants/'+p._id}));
    if(p.carry)put(p.name,{k:'carry',t:'סוחב: '+p.carry,e:'participants/'+p._id});
  });
  S.tasks.filter(t=>t.status!=='בוצע').forEach(t=>split(t.owner).forEach(n=>put(n,{k:'task',t:t.title,e:'tasks/'+t._id,due:t.due})));
  S.packing.filter(x=>!x.done&&!x.sug&&x.buyer).forEach(x=>split(x.buyer).forEach(n=>put(n,{k:'buy',t:`קונה: ${x.qty?x.qty+' × ':''}${x.item}`,e:'packing/'+x._id})));
  S.schedule.filter(x=>x.owner).forEach(x=>split(x.owner).forEach(n=>put(n,{k:'sched',t:`${x.day||''} ${x.time||''} · ${x.title}`,e:'schedule/'+x._id})));
  const W=t=>new Set(String(t).replace(/[^\u0590-\u05FFa-z0-9 ]/gi,' ').split(/\s+/).filter(w=>w.length>=3));
  Object.keys(M).forEach(n=>{const tw=M[n].filter(o=>o.k==='task').map(o=>W(o.t));
    M[n]=M[n].filter(o=>o.k!=='role'||!tw.some(T=>[...W(o.t)].filter(w=>T.has(w)).length>=2))});
  return M;
}

  if(extra)t+=`\nעכשיו כתבתי:\n${extra}\n`;
  if(p.notes.length)t+=`\nרעיונות ועדכונים שנכתבו (${p.notes.length}):\n`+p.notes.map(n=>`- [notes/${n._id}] ${n.by||''}${n.where?' ('+n.where+')':''}: ${n.text}`).join('\n')+'\n';
  if(p.acts.length)t+=`\nשינויים באפליקציה (${p.acts.length}):\n`+p.acts.slice().sort((a,b)=>(a.at||'').localeCompare(b.at||'')).map(a=>`- [${a.col}/${a.rid}] ${a.by||'?'} ${ACTV[a.act]?ACTV[a.act][0]:a.act} ${LBL(a.col)}: ${a.title}${a.change?' · '+a.change:''}`).join('\n')+'\n';

/* ---- auto-apply updates that Claude publishes (encrypted, in updates.enc) ---- */
let autoBusy=false;
async function decryptBlob(j){const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));const key=await deriveKey(TRIP_KEY,b(j.salt));
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b(j.iv)},key,b(j.ct))))}
async function applyOps(ops){const ok=ops.filter(o=>o&&o.c&&o.id&&COLS.includes(o.c));
  for(let i=0;i<ok.length;i+=400){const bt=db.batch();ok.slice(i,i+400).forEach(o=>{const ref=db.collection(o.c).doc(o.id);if(o.op==='delete')bt.delete(ref);else if(o.op==='update')bt.set(ref,o.d||{},{merge:true});else bt.set(ref,o.d||{})});await bt.commit()}
  return ok.length}
async function autoApply(){
  if(autoBusy||!db||!TRIP_KEY||!loaded.has('settings'))return;autoBusy=true;
  try{
    const r=await fetch('updates.enc?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;
    const all=(await decryptBlob(await r.json())).batches||[];
    const st=S.settings.find(x=>x._id==='claude')||{}, done=new Set(st.applied||[]);
    const todo=all.filter(b=>b&&b.id&&!done.has(b.id));if(!todo.length)return;
    let n=0;const notes=[];
    for(const b of todo){n+=await applyOps(b.ops||[]);if(b.note)notes.push(b.note);
      const now=new Date().toISOString();
      await db.collection('settings').doc('claude').set({applied:firebase.firestore.FieldValue.arrayUnion(b.id),seenAt:b.seen&&b.seen>(st.seenAt||'')?b.seen:(st.seenAt||now),appliedAt:now},{merge:true});
      db.collection('activity').add({by:'Claude',at:now,act:'edit',col:'claude',rid:'',title:`עדכן ${(b.ops||[]).length} דברים`,change:b.note||''}).catch(()=>{});}
    toast(`Claude עדכן ${n} דברים`);setTimeout(()=>burst(document.getElementById('actBtn')),200);
  }catch(e){console.warn('autoApply',e)}finally{autoBusy=false}
}
setInterval(autoApply,120000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)autoApply()});


const holderOf=x=>x.holder||(/איציק/.test(x.method||'')?'איציק':/שלומי/.test(x.method||'')?'שלומי':'');

    const out=S.expenses.filter(e=>+e.paid&&String(e.paidBy||'').split(/,\s*/)[0]===n);
    const inn=pin.reduce((s,x)=>s+(+x.amount||0),0)+din.reduce((s,x)=>s+(+x.amount||0),0), o=out.reduce((s,x)=>s+(+x.paid||0),0);

  const un=S.participants.filter(p=>p.status==='שולם'&&!holderOf(p)), und=S.donations.filter(d=>d.status==='התקבל'&&!holderOf(d));

const BULK_TPL={
 unpaid:'שלום {שם}, תזכורת ידידותית לתשלום על שבת הגיבוש בבודפשט: {סכום}. אפשר בהעברה לאיציק, באשראי דרך שלומי (עד 5 תשלומים) או במזומן. תודה רבה!',
 nopass:'שלום {שם}, נשמח לצילום של הדרכון לקראת המסע לבודפשט (בשביל הצ׳ק אין במלון). אפשר לשלוח לי כאן. תודה!',
 all:'שלום {שם}, ',
 carry:'שלום {שם}, תודה שאתה עוזר לנו! רק מזכיר: {סוחב}. ',
 nophone:'שלום {שם}, '};
function bulkSheet(){
  const f=V.filter.pf||'all';
  let list=S.participants.filter(p=>p.phone&&(!V.q||[p.name,p.phone,p.notes,p.carry,p.duties].join(' ').includes(V.q)));
  if(f==='unpaid')list=list.filter(p=>p.status!=='שולם'&&p.status!=='פטור');if(f==='nopass')list=list.filter(p=>!p.passport);if(f==='carry')list=list.filter(p=>p.carry||p.duties);
  list.sort((a,b)=>a.name.localeCompare(b.name,'he'));
  const key='bulkTpl_'+f;let tpl=BULK_TPL[f]||BULK_TPL.all;try{tpl=localStorage.getItem(key)||tpl}catch(e){}
  const sent=new Set(), skip=new Set();
  const fill=p=>tpl.replaceAll('{שם}',p.name.replace(/^הרב(נית)? /,'').split(' ')[0]).replaceAll('{סכום}',ils(p.amount)).replaceAll('{סוחב}',[p.carry,p.duties].filter(Boolean).join(' · '));
  const title={unpaid:'הודעה למי שלא שילם',nopass:'בקשת צילום דרכון',carry:'הודעה למי שיש לו תפקיד',all:'הודעה לכולם'}[f]||'הודעה לרשימה';
  const todo=()=>list.filter(p=>!sent.has(p._id)&&!skip.has(p._id));
  const rows=()=>list.map(p=>`<div class="brow ${sent.has(p._id)?'sent':''} ${skip.has(p._id)?'skip':''}"><button class="check ${skip.has(p._id)?'':'on'}" data-bsk="${p._id}" aria-label="לכלול">${skip.has(p._id)?'':CHECK}</button><div class="main"><b>${esc(p.name)}</b><small class="num ltr">${esc(p.phone)}</small></div>${sent.has(p._id)?'<span class="pill p-ok">נשלח ✓</span>':`<a class="pill p-gold" href="${waLink(p.phone,fill(p))}" target="_blank" rel="noopener" data-bsend="${p._id}">שליחה</a>`}</div>`).join('');
  const nextBtn=()=>{const t=todo();return t.length?`<button class="btn primary bnext" id="bNext">שליחה ל${esc(t[0].name)} <span class="num">(${list.length-t.length+1}/${list.length-skip.size})</span></button>`:`<div class="bdone">🎉 נשלח לכולם</div>`};
  sheet(`<h3>${title}</h3><p class="note" style="margin-top:0">${list.length} אנשים לפי הסינון שבחרת. וואטסאפ לא מאפשר לשלוח לכולם בלחיצה אחת, אז לוחצים "שליחה", שולחים בוואטסאפ, חוזרים לכאן ולוחצים שוב לבא בתור.</p>
   <label class="field">נוסח ההודעה ({שם}${f==='unpaid'?', {סכום}':''}${f==='carry'?', {סוחב}':''} מתמלאים לבד)<textarea id="bTpl">${esc(tpl)}</textarea></label>
   <div id="bNextWrap" style="margin:12px 0">${nextBtn()}</div><div class="card" id="bList">${rows()||'<div class="empty"><b>אין למי לשלוח</b>אין טלפונים לאנשים ברשימה</div>'}</div>
   <div class="sheet-acts"><button class="btn" id="bCopyNames">העתקת רשימת השמות לקבוצה</button></div>`);
  const ta=document.getElementById('bTpl'),L=document.getElementById('bList'),N=document.getElementById('bNextWrap');
  const redraw=()=>{L.innerHTML=rows();N.innerHTML=nextBtn()};
  ta.oninput=()=>{tpl=ta.value;try{localStorage.setItem(key,tpl)}catch(e){}redraw()};
  const mark=id=>{sent.add(id);setTimeout(redraw,400)};
  L.onclick=e=>{const sk=e.target.closest('[data-bsk]');if(sk){const id=sk.dataset.bsk;skip.has(id)?skip.delete(id):skip.add(id);redraw();return}
    const s=e.target.closest('[data-bsend]');if(s)mark(s.dataset.bsend)};
  N.onclick=e=>{if(!e.target.closest('#bNext'))return;const p=todo()[0];if(!p)return;window.open(waLink(p.phone,fill(p)),'_blank');mark(p._id)};
  document.getElementById('bCopyNames').onclick=()=>copy(title+':\n'+list.filter(p=>!skip.has(p._id)).map(p=>'• '+p.name).join('\n'));
}

  ppl.forEach(p=>{const solo=isOut?p.outbound==='נפרד':p.returnGroup==='עצמאי';
    const f=solo?null:S.flights.find(f=>f.dir===dir&&paxOf(f).some(x=>x._id===p._id));
    const k=solo?'solo':f?f._id:'none';let g=groups.find(g=>g.k===k);if(!g){g={k,f,solo,names:[]};groups.push(g)}g.names.push(firstN(p.name))});
  return groups}

     <div class="gta"><button class="btn primary" data-claim-ok="${t._id}">✓ אישור</button><button class="btn ghost" data-claim-no="${t._id}">דחייה</button></div></div>`).join('')}</div>`:card('','אין בקשות לקיחה כרגע')}
